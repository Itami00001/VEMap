server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Точное совпадение: не затрагивает остальные MIME-типы.
    location = /maplibre-gl-worker.mjs {
        default_type application/javascript;
    }

    location = /maplibre-gl-shared.mjs {
        default_type application/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Все API-запросы из браузера идут через frontend origin.
    # nginx внутри compose обращается к backend по имени сервиса.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # /data/ — и статика (geojson), и SPA-роут /data: несуществующие
    # пути (включая сам /data/) отдаём index.html, иначе try_files
    # в location / делает 301 на директорию и дальше 403.
    location /data/ {
        expires 1d;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.html;
    }

    # Точное совпадение: SPA-роут /data без слэша. Без него срабатывает
    # directory-redirect из location / (301 на /data/), а nginx строит
    # Location без :5173 — прямое открытие /data ломается.
    location = /data {
        try_files /index.html =404;
    }
}
