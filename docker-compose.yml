services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mapmood
      POSTGRES_PASSWORD: mapmood
      POSTGRES_DB: mapmood
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapmood -d mapmood"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
      - ./data:/data
      - wiki_files:/app/storage/wiki
    environment:
      DATABASE_URL: postgresql://mapmood:mapmood@postgres:5432/mapmood
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_MODEL: ${YANDEX_MODEL:-yandexgpt/latest}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-gemini-3.5-flash-lite}
      CHAT_ALLOW_CLOUD: ${CHAT_ALLOW_CLOUD:-true}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-Qwen2.5-1.5B-Instruct}
      WIKI_TELEGRAM_TOKEN: ${WIKI_TELEGRAM_TOKEN:-}
      WIKI_TELEGRAM_CHAT_ID: ${WIKI_TELEGRAM_CHAT_ID:-0}
      WIKI_TRUST_PROXY: ${WIKI_TRUST_PROXY:-false}
      WIKI_PROCESSOR: ${WIKI_PROCESSOR:-[]}
      WIKI_OCR_COMMAND: ${WIKI_OCR_COMMAND:-[]}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  wiki_files:
