services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: mapmood
      POSTGRES_PASSWORD: mapmood
      POSTGRES_DB: mapmood
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: postgresql://mapmood:mapmood@postgres:5432/mapmood
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      - postgres

  frontend:
    # Образ собирается из локального dist (см. frontend/Dockerfile):
    # сначала `npm run build` в frontend/ (VITE_* запекаются из окружения),
    # затем `docker compose build frontend`.
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
