server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Точное совпадение: не затрагивает остальные MIME-типы.
    location = /maplibre-gl-worker.mjs {
        default_type application/javascript;
    }

    location = /maplibre-gl-shared.mjs {
        default_type application/javascript;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /data/ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
